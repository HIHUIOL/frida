name: Build frida-agent.ko (arm64)

on:
  workflow_dispatch:
    inputs:
      frida_ref:
        description: "frida repo ref (branch/tag/commit)"
        required: false
        default: "main"
      agent_flavor:
        description: "agent flavor: linux (kmod) or linux-injected"
        required: false
        default: "linux"

permissions:
  contents: read

env:
  MACHINE_PIC: none-arm64-softfloat_pic
  MACHINE_NOPIC: none-arm64-softfloat_nopic
  KVER_BRANCH: android16-6.12-2025-06
  KVER_REPO: https://github.com/cctv18/android_gki_kernel_common.git

jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frida
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: ${{ inputs.frida_ref }}
          submodules: false

      - name: Fetch releng
        run: |
          git submodule update --init --depth 1 releng
          cd releng && git submodule update --init --depth 1

      - name: Download SDKs
        run: |
          # Only the nopic SDK is needed: everything ends up in a kernel
          # module, which cannot use GOT-based relocations.
          python3 releng/deps.py sync sdk "$MACHINE_NOPIC" "$RUNNER_WORKSPACE/sdk-nopic"
          ls "$RUNNER_WORKSPACE/sdk-nopic/include" | head

      - name: Pack
        run: |
          mkdir -p /tmp/out
          tar -cJf /tmp/out/sdk-nopic.tar.xz -C "$RUNNER_WORKSPACE" sdk-nopic
          ls -la /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: /tmp/out

  gumjs-devkit:
    needs: sdk
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frida
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: ${{ inputs.frida_ref }}
          submodules: false

      - name: Fetch frida-gum + releng
        run: |
          git submodule update --init --depth 1 releng
          cd releng && git submodule update --init --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 tools/ensure-submodules.py frida-gum

      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: /tmp/sdk

      - name: Unpack SDK
        run: |
          mkdir -p "$RUNNER_WORKSPACE"
          tar -xJf /tmp/sdk/sdk-nopic.tar.xz -C "$RUNNER_WORKSPACE"
          ls "$RUNNER_WORKSPACE/sdk-nopic"

      - name: Install LLVM
        run: |
          curl -sSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip pkg-config
          pip3 install --break-system-packages meson

      - name: Configure frida-gum
        working-directory: subprojects/frida-gum
        env:
          CC: clang
          CXX: clang++
        run: |
          export PATH=/usr/lib/llvm-21/bin:$PATH
          # MACHINE_NOPIC, not PIC: a kernel module cannot carry GOT-based
          # relocations (R_AARCH64_ADR_GOT_PAGE / LD64_GOT_LO12_NC); the
          # arm64 module loader in arch/arm64/kernel/module.c supports neither.
          ./configure \
            --host="$MACHINE_NOPIC" \
            --enable-gumjs \
            --with-devkits=gum,gumjs \
            --with-devkit-symbol-scope=original

      - name: Compile frida-gum
        working-directory: subprojects/frida-gum
        env:
          CC: clang
          CXX: clang++
        run: |
          export PATH=/usr/lib/llvm-21/bin:$PATH
          make -j$(nproc)

      - name: Pack devkit
        run: |
          mkdir -p /tmp/out
          ls -la subprojects/frida-gum/build/bindings/gumjs/devkit/ || true
          tar -cJf /tmp/out/gumjs-devkit.tar.xz \
            -C "$GITHUB_WORKSPACE/subprojects/frida-gum/build/bindings/gumjs" devkit
          ls -la /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: gumjs-devkit
          path: /tmp/out

  agent:
    needs: [sdk, gumjs-devkit]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frida
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: ${{ inputs.frida_ref }}
          submodules: false

      - name: Fetch frida-core + releng
        run: |
          git submodule update --init --depth 1 releng
          cd releng && git submodule update --init --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 tools/ensure-submodules.py frida-core

      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: /tmp/sdk
      - uses: actions/download-artifact@v4
        with:
          name: gumjs-devkit
          path: /tmp/devkit

      - name: Unpack SDK + devkit
        run: |
          mkdir -p "$RUNNER_WORKSPACE"
          tar -xJf /tmp/sdk/sdk-nopic.tar.xz -C "$RUNNER_WORKSPACE"
          tar -xJf /tmp/devkit/gumjs-devkit.tar.xz -C "$RUNNER_WORKSPACE"
          ls -la "$RUNNER_WORKSPACE/devkit"

      - name: Install LLVM 21
        run: |
          curl -sSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu ninja-build
          which aarch64-linux-gnu-nm aarch64-linux-gnu-ar aarch64-linux-gnu-ld

      - name: Set up Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup component add rust-src
          rustup target add aarch64-unknown-none
          rustc --version

      - name: Build agent (cargo, --features linux)
        working-directory: subprojects/frida-core/src/barebone/agent
        env:
          GUMJS_DEVKIT_DIR: ${{ runner.workspace }}/devkit
          FRIDA_SDK: ${{ runner.workspace }}/sdk-nopic
          RUSTC_BOOTSTRAP: "1"
        run: |
          export PATH=/usr/lib/llvm-21/bin:$PATH
          RUSTFLAGS="-Zfixed-x18" \
          CC_aarch64_unknown_none="clang --target=aarch64-none-elf -mabi=aapcs-soft -mgeneral-regs-only -ffixed-x18 -fno-pic --sysroot=$FRIDA_SDK -isystem $FRIDA_SDK/include -I$FRIDA_SDK/include/glib-2.0 -I$FRIDA_SDK/lib/glib-2.0/include -I$FRIDA_SDK/include/capstone -I$FRIDA_SDK/include/json-glib-1.0" \
          cargo build --release --target aarch64-unknown-none \
            --features "${{ inputs.agent_flavor }}" \
            --target-dir target-linux \
            -Z build-std=core,alloc,compiler_builtins

      - name: Pack agent
        run: |
          mkdir -p /tmp/out
          ls -la subprojects/frida-core/src/barebone/agent/target-linux/aarch64-unknown-none/release/ || true
          tar -cJf /tmp/out/agent-lib.tar.xz \
            -C "$GITHUB_WORKSPACE/subprojects/frida-core/src/barebone/agent" target-linux
          ls -la /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: agent-lib
          path: /tmp/out

  kmod:
    needs: [agent]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frida
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: ${{ inputs.frida_ref }}
          submodules: false

      - name: Fetch frida-core + releng
        run: |
          git submodule update --init --depth 1 releng
          cd releng && git submodule update --init --depth 1
          cd "$GITHUB_WORKSPACE"
          python3 tools/ensure-submodules.py frida-core

      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: /tmp/sdk
      - uses: actions/download-artifact@v4
        with:
          name: gumjs-devkit
          path: /tmp/devkit
      - uses: actions/download-artifact@v4
        with:
          name: agent-lib
          path: /tmp/agent

      - name: Unpack everything
        run: |
          mkdir -p "$RUNNER_WORKSPACE"
          tar -xJf /tmp/sdk/sdk-nopic.tar.xz       -C "$RUNNER_WORKSPACE"
          tar -xJf /tmp/devkit/gumjs-devkit.tar.xz -C "$RUNNER_WORKSPACE"
          tar -xJf /tmp/agent/agent-lib.tar.xz \
            -C "$GITHUB_WORKSPACE/subprojects/frida-core/src/barebone/agent"

      - name: Install LLVM 21 + binutils + kernel deps
        run: |
          curl -sSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu bison flex libssl-dev \
            libelf-dev bc kmod libdw-dev libdwarf-dev zlib1g-dev libiberty-dev \
            dwarves pahole cpio rsync

      - name: Patch frida-kmod.c for 6.12 GKI
        run: |
          F="$GITHUB_WORKSPACE/subprojects/frida-core/src/barebone/agent/linux/frida-kmod.c"
          cp "$F" "$F.orig"
          # fetch the patch script from our own fork (the frida checkout above
          # pulls upstream, so .ci/ is not present here)
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/.ci/patch_frida_kmod.py" \
            -o /tmp/patch_frida_kmod.py
          head -3 /tmp/patch_frida_kmod.py
          python3 /tmp/patch_frida_kmod.py "$F"
          echo "=== diff ==="
          diff -u "$F.orig" "$F" || true

      - name: Fetch kernel source
        run: |
          cd "$RUNNER_WORKSPACE"
          git clone --depth 1 -b "$KVER_BRANCH" "$KVER_REPO" ksrc
          du -sh ksrc

      - name: Prepare kernel tree
        working-directory: ${{ runner.workspace }}/ksrc
        env:
          LLVM: "1"
        run: |
          export PATH=/usr/lib/llvm-21/bin:$PATH
          make ARCH=arm64 LLVM=1 O=out gki_defconfig

          # The device kernel enables CONFIG_RUST, which selects
          # CFI_ICALL_NORMALIZE_INTEGERS, which adds
          # -fsanitize-cfi-icall-experimental-normalize-integers to CC_FLAGS_CFI.
          # Without it every KCFI type id in our module is missing the
          # ".normalized" suffix and therefore mismatches the device:
          #   int(void)             -> 0x36b1c5a6   (wrong)
          #   int(void).normalized  -> 0x6fbb3035   (device value)
          echo "CONFIG_CFI_ICALL_NORMALIZE_INTEGERS=y" >> out/.config
          ./scripts/config --file out/.config \
            -e CFI_ICALL_NORMALIZE_INTEGERS
          grep -E 'CFI_ICALL_NORMALIZE' out/.config

          make ARCH=arm64 LLVM=1 O=out olddefconfig
          grep -E 'CONFIG_CFI' out/.config

          make ARCH=arm64 LLVM=1 O=out -j$(nproc) modules_prepare

      - name: Inject Module.symvers (device CRCs)
        run: |
          # modules_prepare does not emit Module.symvers; without it modpost
          # reports every core export (memset, kfree, _printk, ...) as undefined.
          # These 4432 entries were recovered from the __versions of the 375
          # vendor .ko shipped with the device, so the CRCs are the real ones.
          curl -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/.ci/Module.symvers" \
            -o "$RUNNER_WORKSPACE/ksrc/out/Module.symvers"
          wc -l "$RUNNER_WORKSPACE/ksrc/out/Module.symvers"
          head -2 "$RUNNER_WORKSPACE/ksrc/out/Module.symvers"
          echo "--- sanity: must contain module_layout and memset ---"
          grep -c 'module_layout' "$RUNNER_WORKSPACE/ksrc/out/Module.symvers"
          grep -c '	memset	' "$RUNNER_WORKSPACE/ksrc/out/Module.symvers"

      - name: Pre-link agent objects
        working-directory: ${{ github.workspace }}/subprojects/frida-core/src/barebone/agent/linux
        env:
          GUMJS_DEVKIT_DIR: ${{ runner.workspace }}/devkit
          FRIDA_SDK: ${{ runner.workspace }}/sdk-nopic
          PREFIX: aarch64-linux-gnu-
        run: |
          set -x
          AGENT_DIR="$GITHUB_WORKSPACE/subprojects/frida-core/src/barebone/agent"
          AGENT_LIB="$AGENT_DIR/target-linux/aarch64-unknown-none/release/libfrida_barebone_agent.a"
          ls -la "$AGENT_LIB"

          SF="$AGENT_DIR/target-linux/libfrida-barebone-agent-softfloat.a"
          cp "$AGENT_LIB" "$SF"

          DOBJ=$(${PREFIX}nm --print-armap "$SF" | sed -n 's/^__muldf3 in //p')
          if [ -n "$DOBJ" ]; then ${PREFIX}ar d "$SF" $DOBJ; fi
          ${PREFIX}ar s "$SF"

          LIBC="$AGENT_DIR/target-linux/libc-trimmed.a"
          cp "$FRIDA_SDK/lib/libc.a" "$LIBC"
          ${PREFIX}nm --defined-only "$SF" \
            | awk 'NF == 3 && $2 ~ /^[TDBR]$/ { print $3 }' | sort -u > "$LIBC.agent-syms"
          ${PREFIX}nm --print-armap "$LIBC" | sed -n 's/^\([^ ]*\) in \(.*\)$/\1 \2/p' | sort -u > "$LIBC.members"
          ${PREFIX}ar d "$LIBC" $(join "$LIBC.agent-syms" "$LIBC.members" | awk '{ print $2 }' | sort -u) || true
          ${PREFIX}ar s "$LIBC"
          rm -f "$LIBC.agent-syms" "$LIBC.members"

          PRELINKED="frida-agent-prelinked.o.bin"
          ${PREFIX}ld -r -T prelink.lds -o "$PRELINKED.tmp" \
            --whole-archive "$SF" --no-whole-archive \
            --start-group \
              "$GUMJS_DEVKIT_DIR/libfrida-gumjs.a" \
              "$LIBC" \
              "$FRIDA_SDK/lib/libm.a" \
              "$FRIDA_SDK/lib/libclang_rt.builtins.a" \
            --end-group
          ${PREFIX}objcopy \
            --keep-global-symbol=frida_agent_start \
            --keep-global-symbol=frida_agent_stop \
            --keep-global-symbol=gum_interceptor_obtain \
            --keep-global-symbol=gum_interceptor_begin_transaction \
            --keep-global-symbol=gum_interceptor_end_transaction \
            --keep-global-symbol=gum_interceptor_replace \
            --keep-global-symbol=gum_interceptor_revert \
            --strip-debug --remove-section=.llvmbc --remove-section=.llvmcmd \
            "$PRELINKED.tmp" "$PRELINKED"
          rm -f "$PRELINKED.tmp"
          ls -la "$PRELINKED"

      - name: Build frida-agent.ko
        working-directory: ${{ github.workspace }}/subprojects/frida-core/src/barebone/agent/linux
        env:
          KDIR: ${{ runner.workspace }}/ksrc
          KOUT: ${{ runner.workspace }}/ksrc/out
        run: |
          export PATH=/usr/lib/llvm-21/bin:$PATH
          DEFS=""
          grep -q 'list_head[[:space:]]*thread_group;' "$KDIR/include/linux/sched.h" && DEFS="$DEFS -DFRIDA_HAVE_TASK_THREAD_GROUP"
          grep -q 'spinlock_t[[:space:]]*lock;' "$KDIR/include/linux/fs_struct.h" && DEFS="$DEFS -DFRIDA_HAVE_FS_STRUCT_LOCK"
          echo "DEFS=$DEFS"
          make -C "$KDIR" O="$KOUT" M="$PWD" ARCH=arm64 LLVM=1 \
            FRIDA_KMOD_DEFS="$DEFS" MODULE_NAME=frida-agent modules
      - name: Inspect result
        run: |
          D="$GITHUB_WORKSPACE/subprojects/frida-core/src/barebone/agent/linux"
          ls -la "$D"
          KO="$D/frida-agent.ko"
          echo "=== reloc types used ==="
          llvm-readelf -r "$KO" 2>/dev/null | grep -oE 'R_AARCH64_[A-Z0-9_]+' | sort | uniq -c | sort -rn
          echo "=== GOT relocations present? (must be 0) ==="
          llvm-readelf -r "$KO" 2>/dev/null | grep -cE 'R_AARCH64_(ADR_GOT_PAGE|LD64_GOT_LO12_NC|GOTREL64|GOTREL32)' || true
          echo "=== vermagic ==="
          strings "$KO" | grep -i 'vermagic=' || true
          echo "=== KCFI before patch ==="
          llvm-objcopy -O binary --only-section=.init.text "$KO" /tmp/i.bin 2>/dev/null
          od -A n -t x1 -N 4 /tmp/i.bin
          llvm-objcopy -O binary --only-section=.exit.text "$KO" /tmp/e.bin 2>/dev/null
          od -A n -t x1 -N 4 /tmp/e.bin

      - name: Patch KCFI type hashes
        run: |
          # With CONFIG_CFI_ICALL_NORMALIZE_INTEGERS=y the compiler now emits
          # the device's own type ids, so nothing should need patching.
          # Verify instead, and only patch if something is still off.
          D="$GITHUB_WORKSPACE/subprojects/frida-core/src/barebone/agent/linux"
          KO="$D/frida-agent.ko"
          llvm-objcopy -O binary --only-section=.init.text "$KO" /tmp/i2.bin 2>/dev/null
          llvm-objcopy -O binary --only-section=.exit.text "$KO" /tmp/e2.bin 2>/dev/null
          INIT=$(od -A n -t x1 -N 4 /tmp/i2.bin | tr -d ' \n')
          EXIT=$(od -A n -t x1 -N 4 /tmp/e2.bin | tr -d ' \n')
          echo "init_module    = $INIT  (device expects 3530bb6f)"
          echo "cleanup_module = $EXIT  (device expects 607dc4e5)"
          if [ "$INIT" = "3530bb6f" ] && [ "$EXIT" = "607dc4e5" ]; then
            echo "KCFI OK - no patch needed"
          else
            echo "MISMATCH - patching"
            INIT_OFF=$(readelf -S -W "$KO" | awk '$2==".init.text"{print $5}')
            EXIT_OFF=$(readelf -S -W "$KO" | awk '$2==".exit.text"{print $5}')
            printf '\x35\x30\xbb\x6f' | dd of="$KO" bs=1 seek=$((0x$INIT_OFF)) conv=notrunc
            printf '\x60\x7d\xc4\xe5' | dd of="$KO" bs=1 seek=$((0x$EXIT_OFF)) conv=notrunc
            echo "patched"
          fi
          echo "=== KCFI after patch ==="
          llvm-objcopy -O binary --only-section=.init.text "$KO" /tmp/i2.bin 2>/dev/null
          od -A n -t x1 -N 4 /tmp/i2.bin
          llvm-objcopy -O binary --only-section=.exit.text "$KO" /tmp/e2.bin 2>/dev/null
          od -A n -t x1 -N 4 /tmp/e2.bin
          od -A n -t x1 -N 4 /tmp/e.bin 2>/dev/null

      - name: Pack output
        run: |
          mkdir -p /tmp/out
          D="$GITHUB_WORKSPACE/subprojects/frida-core/src/barebone/agent/linux"
          cp "$D"/*.ko /tmp/out/ 2>/dev/null || true
          cp "$D"/frida-agent-prelinked.o.bin /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: frida-agent-ko
          path: /tmp/out